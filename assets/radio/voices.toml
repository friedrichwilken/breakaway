# Voices for the radio clips (tools/gen_voices.py, `just voices`), one table
# per speaker of assets/radio/lines.toml. `voice`: a Kokoro voice id (the
# local `tts` container lists them at GET /v1/audio/voices); `speed`;
# optional `lang_code` (the reading language). Changing a value regenerates
# that speaker's clips on the next `just voices`.

[ds]
voice = "bm_george"
speed = 1.1

[partner]
voice = "im_nicola"
lang_code = "a"      # English reading with the Italian voice
speed = 1.1
