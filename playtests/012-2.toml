task  = 12
step  = 2
title = "Under-band calls"
loop_seconds = 60
# hit-30-30 at FTP 200: the first 20 x 30/30 set is steps 13-52, workout
# time 1740-2940 s (pulls start at 1740, 1800, ...; drafts at 1770, 1830, ...).
# 1860 s: 2 min into the set (step 17, a pull), riding 25 % under.

[[stage]]
cmd = "set_ftp"
ftp_w = 200

[[stage]]
cmd = "autopilot"
on = true

[[stage]]
cmd = "load_workout"
path = "samples/hit-30-30.json"

[[stage]]
cmd = "seek_workout"
elapsed_s = 1860

[[stage]]
cmd = "autopilot_bias"
pct = -25

[ask]
text = "Do the under-band calls feel like a team mate helping, not nagging?"
