task  = 12
step  = 1
title = "Radio calls before the first 20x set"
loop_seconds = 120
# hit-30-30 at FTP 200: the first 20 x 30/30 set is steps 13-52, workout
# time 1740-2940 s (pulls start at 1740, 1800, ...; drafts at 1770, 1830, ...).
# 1725 s: 15 s before the set's first pull (step 12, recovery); the
# warning comes at 1730 s.

[[stage]]
cmd = "set_ftp"
ftp_w = 200

[[stage]]
cmd = "autopilot"
on = true

[[stage]]
cmd = "load_workout"
path = "samples/hit-30-30.json"

[[stage]]
cmd = "seek_workout"
elapsed_s = 1725

[ask]
text = "Do the radio calls tell you early enough what is coming, and are they readable while riding?"
